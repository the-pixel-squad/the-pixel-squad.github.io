name: Fix mobile download position

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move download beside close on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '@media(max-width:800px){'
          new = '@media(max-width:800px){.download{position:fixed!important;right:68px!important;top:14px!important;bottom:auto!important;width:auto!important;height:42px!important;padding:0 15px!important;border-radius:22px!important;display:flex!important;align-items:center!important;justify-content:center!important;font:10px Arial,sans-serif!important;letter-spacing:.12em!important;text-transform:uppercase!important;z-index:102!important}'
          if old not in s:
              raise SystemExit('mobile media query not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit website fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile download button position" || exit 0
          git push

      - name: Remove this workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-mobile-download.yml
          git add .github/workflows/fix-mobile-download.yml
          git commit -m "Remove one-time mobile download workflow" || exit 0
          git push
