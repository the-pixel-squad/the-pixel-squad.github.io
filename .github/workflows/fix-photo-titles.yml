name: Fix mismatched photo titles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct photo mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = {
            'data-category="sky" data-no="03" data-caption="Golden hour"><img src="images/golden-01.jpg" alt="Golden hour"':
            'data-category="nature" data-no="03" data-caption="Cave light"><img src="images/cave.jpg" alt="Cave light"',
            'data-category="city sky clouds" data-no="04" data-caption="Last light"><img src="images/golden-02.jpg" alt="Last light over the city"':
            'data-category="sky clouds" data-no="04" data-caption="Darjeeling"><img src="images/darjeeling.jpg" alt="Darjeeling mountain landscape"',
            'data-category="sky" data-no="05" data-caption="Blue hour"><img src="images/city-03.jpg" alt="Blue hour sky"':
            'data-category="sky clouds" data-no="05" data-caption="Mountain mist"><img src="images/hills-01.jpg" alt="Mountain landscape in mist"',
            'data-category="sea sky" data-no="06" data-caption="Ocean light"><img src="images/ocean-01.jpg" alt="Ocean light"':
            'data-category="city night" data-no="06" data-caption="Victoria Memorial"><img src="images/memorial-night.jpg" alt="Victoria Memorial at night"',
            'data-category="sea sky" data-no="07" data-caption="After the wave"><img src="images/ocean-02.jpg" alt="Ocean waves at dusk"':
            'data-category="city night" data-no="07" data-caption="Rainy street"><img src="images/ocean-02.jpg" alt="Rainy city street at night"',
            'data-category="city" data-no="08" data-caption="Victoria Memorial"><img src="images/temple-day.jpg" alt="Victoria Memorial"':
            'data-category="sea sky" data-no="08" data-caption="Ocean light"><img src="images/sky-clouds.jpg" alt="Ocean under a pastel sky"',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected photo mapping: {old[:90]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct photo titles and mappings" || exit 0
          git push

      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-photo-titles.yml
          git add .github/workflows/fix-photo-titles.yml
          git commit -m "Remove one-time photo title workflow" || exit 0
          git push
