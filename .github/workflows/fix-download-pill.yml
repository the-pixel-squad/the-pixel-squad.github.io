name: Fix download button shape

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make download button a pill
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.download{right:85px;top:23px;bottom:auto;width:48px;height:48px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font:22px Arial,sans-serif;letter-spacing:0}'
          new = '.download{right:85px;top:26px;bottom:auto;width:auto;height:42px;padding:0 18px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}'
          if old not in s:
              raise SystemExit('download CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit website fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make download button pill shaped' || exit 0
          git push
      - name: Remove this workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-download-pill.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-download-pill.yml
          git commit -m 'Remove one-time download pill workflow' || exit 0
          git push
